# xxproject public entry @3: only the v3 workbench is served. The page is static
# code; every data read and action needs a live workbench session (token login).
# The previous audit page is retired; its paths redirect to v3.
map "$request_method:$http_authorization" $xxproject_session_bearer {
    default "";
    ~^POST:Bearer\s+ $http_authorization;
}
limit_req_zone $binary_remote_addr zone=xxproject_public:2m rate=8r/s;
limit_req_zone $binary_remote_addr zone=xxproject_session:1m rate=1r/s;
log_format xxproject_private_access '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name 169.58.177.126;
    server_tokens off;
    access_log /var/log/nginx/xxproject-public.access.log xxproject_private_access;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/xxproject/acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 308 https://169.58.177.126$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name 169.58.177.126;
    if ($host != 169.58.177.126) { return 421; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/xxproject-eu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxproject-eu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xxproject_tls:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    limit_req zone=xxproject_public burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 2;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control no-store always;
    access_log /var/log/nginx/xxproject-public.access.log xxproject_private_access;
    error_log /var/log/nginx/xxproject-public.error.log warn;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_read_timeout 310s;
    error_page 401 /__xxproject_401.html;
    location = /__xxproject_401.html {
        internal;
        root /etc/nginx/xxproject-errors;
        try_files /401.html =401;
        default_type text/html;
        charset utf-8;
    }
    location = / { return 302 /signal-audit/workbench-v3/; }
    # The v3 page is static code with no data, served straight from disk (no proxy,
    # no path rewriting). It reads data through /api/workbench below.
    location = /signal-audit/workbench-v3 { return 308 /signal-audit/workbench-v3/; }
    location ^~ /signal-audit/workbench-v3/ {
        limit_except GET { deny all; }
        alias /opt/signal-audit/workbench-v3/;
        index index.html;
    }
    # auth_request target: 204 with a live session cookie, 401 otherwise.
    location = /__xxproject_session_check {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8895/api/workbench/session/check;
    }
    # The previous audit page is retired: its entry and old links land on v3.
    location = /signal-audit { return 302 /signal-audit/workbench-v3/; }
    location ^~ /signal-audit/ { return 302 /signal-audit/workbench-v3/; }
    # The session exchange returns no market data (GET answers only whether this
    # browser holds a session) and keeps the backend's token and same-origin checks.
    location = /api/workbench/session {
        client_max_body_size 8k;
        limit_req zone=xxproject_session burst=8 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $xxproject_session_bearer;
        proxy_pass http://127.0.0.1:8895;
    }
    location = /api/workbench {
        auth_request /__xxproject_session_check;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8895;
    }
    location ^~ /api/workbench/ {
        auth_request /__xxproject_session_check;
        proxy_pass http://127.0.0.1:8895;
    }
    location / { return 404; }
}
