# Systemd drop-in template for enabling v1.3 SHADOW_ONLY AI Player & retiring legacy player.run.
# Apply to /etc/systemd/system/astra-workbench-v20.service.d/ and /etc/systemd/system/astra-research-archive.service.d/
[Service]
Environment=ASTRA_AI_SHADOW_EXPERIMENT=1
Environment=ASTRA_AI_SHADOW_DOSSIER_ROOT=/var/lib/xxproject/workbench/shadow_dossiers
ReadWritePaths=/var/lib/xxproject/workbench
