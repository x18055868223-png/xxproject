<!doctype html>
<html lang="zh-CN" class="astra-paperline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信号审计文档</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --faint: #8a8a8a;
      --line: #dedede;
      --line-strong: #b8b8b8;
      --surface: #f7f7f7;
      --surface-2: #eeeeee;
      --focus: #000000;
      --good: #174d2a;
      --bad: #6b1d1d;
      --wait: #4d3d00;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    body {
      margin: 0;
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 328px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      padding: 24px 18px;
      background: var(--bg);
    }

    .mobile-index-toggle {
      display: none;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--bg);
      padding: 10px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-weight: 760;
      text-align: left;
    }

    .mobile-index-toggle .count {
      font-weight: 650;
    }

    .brand {
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 760;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .filter-stack {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .control,
    .select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
    }

    .control:focus,
    .select:focus,
    .index-item:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
    }

    .index-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 10px;
    }

    .index-heading h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .index-list {
      display: grid;
      gap: 8px;
    }

    .index-item {
      width: 100%;
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    .index-item:hover {
      border-color: var(--ink);
    }

    .index-item.is-active {
      border-color: var(--ink);
      box-shadow: inset 3px 0 0 var(--ink);
    }

    .index-topline,
    .meta-row,
    .split-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .index-symbol {
      font-size: 16px;
      font-weight: 760;
    }

    .index-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .index-summary {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .transition-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .transition-badges span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--surface);
    }

    .workspace {
      min-width: 0;
      padding: 30px 42px 48px;
    }

    .document {
      max-width: 1180px;
      margin: 0 auto;
    }

    .load-alert {
      border-left: 4px solid var(--bad);
      background: #fff7f7;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .load-alert strong {
      display: block;
      margin-bottom: 4px;
    }

    .load-alert p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card-load-state {
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      padding: 16px;
      color: var(--muted);
      background: var(--surface);
    }

    .card-load-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .card-retry {
      min-height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--bg);
      padding: 5px 10px;
      cursor: pointer;
    }

    .card-retry:disabled {
      color: var(--faint);
      cursor: default;
    }

    .integrated-advisory-panel.is-unavailable {
      border-left-color: var(--bad);
      background: #fff7f7;
    }

    .doc-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }

    .doc-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.12;
      font-weight: 780;
    }

    .doc-subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-stack {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--ink);
      background: var(--bg);
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .badge.is-solid {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--bg);
    }

    .badge.is-good {
      border-color: rgba(23, 77, 42, 0.35);
      color: var(--good);
    }

    .badge.is-bad {
      border-color: rgba(107, 29, 29, 0.35);
      color: var(--bad);
    }

    .badge.is-wait {
      border-color: rgba(77, 61, 0, 0.35);
      color: var(--wait);
    }

    .fixed-round-badge {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 26px;
    }

    .metric {
      min-height: 82px;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: var(--bg);
    }

    .metric:last-child {
      border-right: 0;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .metric-value {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 760;
    }

    .metric-note {
      display: block;
      margin-top: 4px;
      color: var(--faint);
      font-size: 12px;
    }

    .comfort-panel,
    .boundary-panel,
    .download-panel {
      border: 1px solid var(--line);
      border-left: 4px solid var(--ink);
      border-radius: 7px;
      background: var(--bg);
      padding: 18px;
    }

    .comfort-panel.is-history,
    .comfort-panel.is-unavailable {
      border-left-color: var(--line-strong);
      background: var(--surface);
    }

    .comfort-panel.is-grade-d {
      border-left-color: var(--bad);
      background: #fffafa;
    }

    .comfort-panel.is-grade-c {
      border-left-color: var(--line-strong);
    }

    .comfort-panel.is-grade-b {
      border-left-color: var(--wait);
      background: #fffdf3;
    }

    .comfort-panel.is-grade-a,
    .comfort-panel.is-grade-s {
      border-left-color: var(--good);
      background: #fbfffc;
    }

    .badge.is-grade-d {
      color: var(--bad);
      border-color: rgba(107, 29, 29, 0.35);
    }

    .badge.is-grade-b {
      color: var(--wait);
      border-color: rgba(77, 61, 0, 0.35);
    }

    .badge.is-grade-a,
    .badge.is-grade-s {
      color: var(--good);
      border-color: rgba(23, 77, 42, 0.35);
    }

    .comfort-headline,
    .comfort-side-card,
    .market-fact-card,
    .download-panel {
      display: grid;
      gap: 10px;
    }

    .comfort-headline {
      margin-bottom: 16px;
    }

    .comfort-headline > span,
    .comfort-side-card p strong,
    .market-fact-card .evidence-fact span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .comfort-headline > strong {
      font-size: 26px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .comfort-headline p,
    .comfort-side-card p,
    .market-fact-card p,
    .download-panel p,
    .boundary-panel p {
      margin: 0;
    }

    .comfort-side-grid,
    .comfort-limit-grid,
    .evidence-action-grid,
    .market-fact-grid {
      display: grid;
      gap: 12px;
    }

    .comfort-side-grid,
    .comfort-limit-grid,
    .evidence-action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 12px;
    }

    .comfort-limit-grid {
      margin-top: 16px;
    }

    .comfort-side-card,
    .market-fact-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
      padding: 14px;
      min-width: 0;
    }

    .evidence-action-cell {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      padding: 12px;
      min-width: 0;
    }

    .evidence-action-cell span,
    .signal-evidence-fact > strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .evidence-action-cell strong {
      display: block;
      margin-top: 5px;
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .evidence-action-cell p,
    .signal-evidence-fact p {
      margin: 6px 0 0;
      line-height: 1.6;
    }

    .signal-evidence-fact {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      display: grid;
      gap: 6px;
    }

    .signal-evidence-fact:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .market-fact-overview {
      display: grid;
      gap: 8px;
    }

    .market-fact-overview-item {
      display: grid;
      grid-template-columns: minmax(84px, auto) minmax(0, 1fr);
      gap: 6px 10px;
      align-items: baseline;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      min-width: 0;
    }

    .market-fact-overview-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .market-fact-overview-item > strong {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .market-fact-overview-item > span {
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .market-fact-overview-item > p,
    .market-fact-more {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .signal-evidence-detail {
      border-top: 1px solid var(--line);
      margin-top: 2px;
      padding-top: 8px;
    }

    .signal-evidence-detail > summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .signal-evidence-detail-body {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .comfort-side-card.is-grade-b {
      border-color: rgba(77, 61, 0, 0.3);
    }

    .comfort-side-card.is-grade-a,
    .comfort-side-card.is-grade-s {
      border-color: rgba(23, 77, 42, 0.35);
    }

    .comfort-side-card.is-grade-d {
      border-color: rgba(107, 29, 29, 0.32);
    }

    .comfort-side-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .comfort-side-head strong,
    .market-fact-card h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .market-fact-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .market-fact-card .evidence-facts {
      margin-top: 0;
    }

    .audit-json-download {
      width: max-content;
      max-width: 100%;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      min-width: 0;
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .section-header {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
      margin-bottom: 16px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 760;
    }

    .section-purpose {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-text {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }

    .kv {
      min-height: 74px;
      padding: 12px;
      background: var(--bg);
      box-shadow: inset -1px 0 0 var(--line), inset 0 -1px 0 var(--line);
    }

    .kv dt {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .kv dd {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .rank-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .rank-cell {
      min-height: 98px;
    }

    .rank-primary {
      display: block;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
    }

    .rank-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 650;
    }

    .rank-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .merge-note {
      margin: 10px 0 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 11px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      line-height: 1.55;
    }

    #signal-rating {
      border-top: 1px solid var(--line-strong);
      padding-top: 24px;
    }

    .signal-rating-panel {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line-strong);
      border-left: 5px solid var(--ink);
      border-radius: 6px;
      padding: 14px 16px;
      background: var(--surface);
      overflow-wrap: anywhere;
    }

    .signal-rating-panel *,
    .signal-rating-detail,
    .signal-rating-detail *,
    .signal-rating-boundary,
    .signal-rating-boundary *,
    .signal-rating-metadata,
    .signal-rating-metadata * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .signal-rating-panel.is-unavailable {
      border-left-color: var(--bad);
      background: #fff7f7;
    }

    .signal-rating-panel.is-history {
      border-left-color: var(--wait);
      background: #fffdf7;
    }

    .signal-rating-topline {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.36fr);
      gap: 14px;
      align-items: start;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .signal-rating-kicker,
    .signal-rating-economics span,
    .signal-rating-meta-grid span,
    .signal-rating-boundary > strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .signal-rating-topline strong,
    .signal-rating-economics strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .signal-rating-topline p,
    .signal-rating-claim p,
    .signal-rating-economics p,
    .signal-rating-meta-grid p,
    .signal-rating-boundary p {
      margin: 7px 0 0;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .signal-rating-economics {
      border-left: 1px solid var(--line);
      padding-left: 14px;
    }

    .signal-rating-claims {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .signal-rating-claim {
      min-width: 0;
      border: 1px solid var(--line);
      border-left: 4px solid var(--line-strong);
      border-radius: 6px;
      padding: 12px;
      background: var(--bg);
    }

    .signal-rating-claim.is-supported {
      border-left-color: var(--good);
    }

    .signal-rating-claim.is-conflicted,
    .signal-rating-claim.is-insufficient {
      border-left-color: var(--wait);
    }

    .signal-rating-claim.is-opposed {
      border-left-color: var(--bad);
    }

    .signal-rating-claim-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .signal-rating-claim-head strong {
      min-width: 0;
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .signal-rating-detail {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .signal-rating-detail > summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .signal-rating-inputs,
    .signal-rating-boundary-badges,
    .signal-rating-source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .signal-rating-entry-list {
      display: grid;
      gap: 8px;
      margin: 8px 0 12px;
      padding: 0;
      list-style: none;
    }

    .signal-rating-entry-list li {
      min-width: 0;
      max-width: 100%;
      border-left: 2px solid var(--line);
      padding-left: 9px;
    }

    .signal-rating-entry-list p,
    .signal-rating-unknown-list p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .signal-rating-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--line);
    }

    .signal-rating-meta-grid > div {
      min-width: 0;
      padding: 11px 12px;
      background: var(--bg);
    }

    .signal-rating-boundary {
      margin-top: 14px;
      border: 1px solid rgba(77, 61, 0, 0.35);
      border-left: 5px solid var(--wait);
      border-radius: 6px;
      padding: 11px 12px;
      background: #fffdf7;
    }

    .signal-rating-replay-notice {
      margin-top: 14px;
      border: 1px solid rgba(77, 61, 0, 0.35);
      border-left: 5px solid var(--wait);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fffdf7;
    }

    .signal-rating-replay-notice strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }

    .signal-rating-replay-notice p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .signal-rating-panel .chip,
    .signal-rating-panel .badge,
    .signal-rating-panel .source-ref-link {
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .signal-rating-warning {

    .evidence-decision-footnote { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .evidence-spatial-report .llm-gamma-copy { display: block; }
    .evidence-spatial-report .llm-gamma-copy p { margin: 12px 0; font-size: 14px; line-height: 1.75; }
    .evidence-spatial-report .llm-gamma-copy strong { margin-right: 8px; }
    .evidence-spatial-scale { padding-top: 12px; margin: 12px 0 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.6; }

    .evidence-change-unavailable { margin: 0; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 13px; color: var(--muted); }
    .evidence-decision-grade { display: flex; align-items: center; gap: 12px; margin-top: 5px; }
    .evidence-decision-grade > strong { font-size: 22px; line-height: 1.25; }
    .evidence-review-panel { padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .evidence-price-bias { padding: 0 0 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .evidence-price-bias-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
    .evidence-price-bias-head > span { font-size: 13px; color: var(--muted); }
    .evidence-price-bias-head > strong { font-size: 21px; color: var(--ink); }

    .review-side-caption { color: var(--muted); font-size: 12px; }

    .evidence-next-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
    .evidence-next-side { padding: 16px; min-width: 0; }

    }
    @media (max-width: 760px) {

      .evidence-reasoning-step:first-child { padding-top: 0; border-top: 0; }
      .evidence-reader .market-fact-overview-item, .evidence-reader .transition-core-row { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 7px 12px; }
      .evidence-reader .market-fact-reading, .evidence-reader .transition-core-row > p { grid-column: 1 / -1; }
      .evidence-reader .market-fact-value, .evidence-reader .transition-core-values { text-align: right; }
      .evidence-reader .comfort-panel, .evidence-reader .market-fact-card, .evidence-changes-panel { padding: 12px; }
      .evidence-reader .comfort-side-card, .evidence-next-side { padding: 13px; }
      .evidence-review-panel { padding: 12px; }
      .evidence-decision-grid, .evidence-decision-meta { grid-template-columns: 1fr; }
      .evidence-decision-side + .evidence-decision-side { border-left: 0; border-top: 1px solid var(--line); }
      .evidence-decision-meta > div { border-right: 0; border-top: 1px solid var(--line); }
      .evidence-decision-meta > div:first-child { border-top: 0; }
      .evidence-reader-nav { gap: 4px 5px; padding-top: 6px; }
      .evidence-reader-nav a { min-height: 30px; padding: 0 8px; font-size: 12px; }
      .evidence-reader [id] { scroll-margin-top: 84px; }
    }
    /* The final appendix uses the formal reader's compact value grid. */
    .evidence-reader .market-fact-overview { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); overflow: hidden; }
    .evidence-reader .market-fact-overview-item { grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; align-content: start; }
    .evidence-reader .market-fact-overview-item { border-right: 1px solid var(--line); }
    .evidence-reader .market-fact-overview-item.is-current-price { grid-column: 1 / -1; background: var(--surface); }
    .evidence-reader .market-fact-reading { grid-column: 1 / -1; }
    .evidence-reader .market-fact-reading:empty { display: none; }
    .evidence-reader .market-fact-value { text-align: right; }
    @media (max-width: 760px) {
      .evidence-reader .market-fact-overview { grid-template-columns: 1fr; }
      .evidence-reader .market-fact-overview-item { border-right: 0; }
      .evidence-spatial-report .llm-gamma-copy p { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
