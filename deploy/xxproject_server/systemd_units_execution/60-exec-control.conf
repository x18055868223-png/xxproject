[Service]
# Mandatory OS isolation for read-only Workbench cockpit when execution coordinator is active:
# runs as dedicated astra-workbench UID/GID, strictly separate from bitnami / astra-player-* / astra-exec,
# and holds ZERO execution control socket/token privileges.
User=astra-workbench
Group=astra-workbench
SupplementaryGroups=bitnami research
UMask=0027
Environment=ASTRA_EXEC_STATUS_PATH=/var/lib/xxproject/execution/public_status.json
ReadOnlyPaths=/var/lib/xxproject/execution
ReadWritePaths=/var/lib/xxproject/workbench /var/lib/xxproject/llm
